<svg xmlns="http://www.w3.org/2000/svg" width="220" height="58" viewBox="0 0 220 58" role="img" aria-labelledby="title desc">
  <title id="title">Ko-fi link button</title>
  <desc id="desc">Animated Ko-fi button with cup icon and Ko-fi colors.</desc>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="220" height="58" rx="12" fill="#071015"/>
  <rect x="1" y="1" width="218" height="56" rx="11" fill="none" stroke="#29abe0" stroke-opacity="0.8"/>
  <rect x="-76" y="0" width="76" height="58" fill="url(#shine)">
    <animate attributeName="x" from="-86" to="232" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(15 13)" filter="url(#glow)">
    <rect x="0" y="6" width="34" height="24" rx="6" fill="#29abe0"/>
    <path d="M29 10h7c7 0 7 15 0 15h-7" fill="none" stroke="#29abe0" stroke-width="5"/>
    <path d="M10 13c3-4 8-2 8 2 0-4 7-6 9-1 2 5-4 10-9 14-5-4-11-9-8-15z" fill="#ff5f5f"/>
    <rect x="5" y="30" width="28" height="3" rx="1.5" fill="#ffffff" opacity="0.85"/>
  </g>
  <text x="62" y="25" fill="#ffffff" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700">Ko-fi</text>
  <text x="62" y="42" fill="#9fd8ef" font-family="Consolas, Menlo, monospace" font-size="12">terrabyte1000</text>
</svg>
