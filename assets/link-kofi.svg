<svg xmlns="http://www.w3.org/2000/svg" width="220" height="58" viewBox="0 0 220 58" role="img" aria-labelledby="title desc">
  <title id="title">Ko-fi link button</title>
  <desc id="desc">Reflective glass link button for terrabyte1000 on Ko-fi.</desc>
  <defs>
    <style>
      .brandGlow,.shine,.edgeFrame{transition:opacity .18s ease,filter .18s ease}
      svg:hover .brandGlow{opacity:.5}
      svg:hover .shine{opacity:.8}
      svg:hover .edgeFrame{opacity:1}
    </style>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17212a" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#080c12" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#030509" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#29abe0" stop-opacity="0.42"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="0.76" stop-color="#ff6433" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#29abe0" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.66" stop-color="#b6f7ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="buttonGlow" x="-35%" y="-80%" width="170%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <clipPath id="clip"><rect x="1" y="1" width="218" height="56" rx="12"/></clipPath>
  <rect width="220" height="58" rx="13" fill="#07121a"/>
  <rect x="1" y="1" width="218" height="56" rx="12" fill="url(#glass)" opacity="0.72"/>
  <rect class="brandGlow" x="2" y="2" width="216" height="54" rx="11" fill="#29abe0" opacity="0.13" filter="url(#buttonGlow)"/>
  <rect class="edgeFrame" x="2" y="2" width="216" height="54" rx="11" fill="none" stroke="url(#edge)" stroke-width="1.7" opacity="0.8"/>
  <rect x="9" y="9" width="40" height="40" rx="10" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.1"/>
  <g clip-path="url(#clip)">
    <rect class="shine" x="22" y="3" width="160" height="26" fill="url(#glint)" opacity="0.36" transform="skewX(-18)"/>
    <path d="M12 8H200L158 27H8Z" fill="#ffffff" opacity="0.055"/>
  </g>
  <g transform="translate(18 17) scale(1.0)" fill="#ff6433" filter="url(#softGlow)">
    <path d="M11.351 2.715c-2.7 0-4.986.025-6.83.26C2.078 3.285 0 5.154 0 8.61c0 3.506.182 6.13 1.585 8.493 1.584 2.701 4.233 4.182 7.662 4.182h.83c4.209 0 6.494-2.234 7.637-4a9.5 9.5 0 0 0 1.091-2.338C21.792 14.688 24 12.22 24 9.208v-.415c0-3.247-2.13-5.507-5.792-5.87-1.558-.156-2.65-.208-6.857-.208m0 1.947c4.208 0 5.09.052 6.571.182 2.624.311 4.13 1.584 4.13 4v.39c0 2.156-1.792 3.844-3.87 3.844h-.935l-.156.649c-.208 1.013-.597 1.818-1.039 2.546-.909 1.428-2.545 3.064-5.922 3.064h-.805c-2.571 0-4.831-.883-6.078-3.195-1.09-2-1.298-4.155-1.298-7.506 0-2.181.857-3.402 3.012-3.714 1.533-.233 3.559-.26 6.39-.26m6.547 2.287c-.416 0-.65.234-.65.546v2.935c0 .311.234.545.65.545 1.324 0 2.051-.754 2.051-2s-.727-2.026-2.052-2.026m-10.39.182c-1.818 0-3.013 1.48-3.013 3.142 0 1.533.858 2.857 1.949 3.897.727.701 1.87 1.429 2.649 1.896a1.47 1.47 0 0 0 1.507 0c.78-.467 1.922-1.195 2.623-1.896 1.117-1.039 1.974-2.364 1.974-3.897 0-1.662-1.247-3.142-3.039-3.142-1.065 0-1.792.545-2.338 1.298-.493-.753-1.246-1.298-2.312-1.298"/>
  </g>
  <text x="62" y="25" fill="#ffffff" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700">Ko-fi</text>
  <text x="62" y="42" fill="#aeb9c4" font-family="Consolas, Menlo, monospace" font-size="12">terrabyte1000</text>
</svg>
