<svg xmlns="http://www.w3.org/2000/svg" width="220" height="58" viewBox="0 0 220 58" role="img" aria-labelledby="title desc">
  <title id="title">Ko-fi link button</title>
  <desc id="desc">Animated Ko-fi button with the Ko-fi logo path and brand colors.</desc>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#29abe0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#29abe0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff6433" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="220" height="58" rx="12" fill="#071015"/>
  <rect x="1.5" y="1.5" width="217" height="55" rx="11" fill="none" stroke="#173848" stroke-width="1"/>
  <rect x="2" y="2" width="216" height="54" rx="10" fill="none" stroke="#29abe0" stroke-width="2" stroke-dasharray="11 17" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-168" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="216" height="54" rx="10" fill="none" stroke="#ff6433" stroke-width="2" stroke-dasharray="11 17" stroke-dashoffset="10" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="10" to="-158" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="-76" y="0" width="76" height="58" fill="url(#shine)">
