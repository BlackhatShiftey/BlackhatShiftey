<svg xmlns="http://www.w3.org/2000/svg" width="220" height="52" viewBox="0 0 220 52" role="img" aria-labelledby="title desc">
  <title id="title">Canticle dot cc</title>
  <desc id="desc">Tokyo Night link button with a cute cat-like ghost spirit and a luminous Canticle crescent.</desc>
  <defs>
