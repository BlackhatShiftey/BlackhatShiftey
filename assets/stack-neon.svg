<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="292" viewBox="0 0 1000 292" role="img" aria-labelledby="title desc">
  <title id="title">BlackhatShiftey operator stack</title>
  <desc id="desc">A Canticle-style terminal matrix listing runtimes, interfaces, systems, and methods.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1f2028"/><stop offset="1" stop-color="#13131a"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6090"/><stop offset=".25" stop-color="#e478d0"/><stop offset=".5" stop-color="#c4a7e7"/><stop offset=".75" stop-color="#7dcfff"/><stop offset="1" stop-color="#73daca"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7dcfff" stroke-opacity=".03"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 .5H1000" stroke="#c0caf5" stroke-opacity=".024"/></pattern>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="292" rx="8" fill="#0e0e15"/>
  <rect x="1" y="1" width="998" height="290" rx="7" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="290" rx="7" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="290" rx="7" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="997" height="289" rx="7" fill="none" stroke="#3b3d57"/>
  <path d="M1 2H190M810 2H999" stroke="url(#spectrum)" stroke-width="2"/>
  <path d="M20 20V40M20 20H40M980 20H960M980 20V40M20 272V252M20 272H40M980 272H960M980 272V252" fill="none" stroke="#565f89"/>

