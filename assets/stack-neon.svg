        <rect x="13" y="7" width="7" height="7" fill="#e478d0"/>
        <rect x="26" y="14" width="7" height="7" fill="#c4a7e7"/>
        <rect x="39" y="21" width="7" height="7" fill="#7dcfff"/>
        <rect x="52" y="28" width="7" height="7" fill="#73daca" filter="url(#glow)"/>
