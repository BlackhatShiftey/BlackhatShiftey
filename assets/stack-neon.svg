      <text x="18" y="27" fill="#565f89" font-size="10" letter-spacing="1.3">ACTIVE LOADOUT</text>
      <text x="18" y="52" fill="#a9b1d6" font-size="13">agent orchestration  /  automation protocols  /  defensive tooling  /  dashboards  /  documentation</text>
