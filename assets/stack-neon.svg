        <rect width="218" height="70" fill="#1a1b26" stroke="#ff6090" stroke-opacity=".45"/>
        <rect width="5" height="70" fill="#ff6090"/>
        <text x="22" y="27" fill="#ff6090" font-size="10" letter-spacing="1.3">RUNTIME</text>
        <text x="22" y="52" fill="#c0caf5" font-size="14">Python  Bash  Node</text>
      </g>
      <g transform="translate(232)">
        <rect width="218" height="70" fill="#1a1b26" stroke="#c4a7e7" stroke-opacity=".45"/>
        <rect width="5" height="70" fill="#c4a7e7"/>
        <text x="22" y="27" fill="#c4a7e7" font-size="10" letter-spacing="1.3">INTERFACE</text>
        <text x="22" y="52" fill="#c0caf5" font-size="14">JS  TS  React</text>
      </g>
      <g transform="translate(464)">
        <rect width="218" height="70" fill="#1a1b26" stroke="#7dcfff" stroke-opacity=".45"/>
        <rect width="5" height="70" fill="#7dcfff"/>
        <text x="22" y="27" fill="#7dcfff" font-size="10" letter-spacing="1.3">SYSTEMS</text>
        <text x="22" y="52" fill="#c0caf5" font-size="14">Linux  Docker  Actions</text>
      </g>
      <g transform="translate(696)">
        <rect width="220" height="70" fill="#1a1b26" stroke="#73daca" stroke-opacity=".45"/>
        <rect width="5" height="70" fill="#73daca"/>
        <text x="22" y="27" fill="#73daca" font-size="10" letter-spacing="1.3">METHOD</text>
        <text x="22" y="52" fill="#c0caf5" font-size="14">Agents  Security</text>
      </g>
    </g>

    <g transform="translate(42 166)">
