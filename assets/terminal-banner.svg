<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">BlackhatShiftey terminal banner</title>
  <desc id="desc">Animated dark terminal banner for BlackhatShiftey, AI Architect, Python, Security Automation.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f8f75" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="22" fill="#05070a"/>
  <rect x="1" y="1" width="998" height="258" rx="21" fill="none" stroke="#1f8f75" stroke-opacity="0.75"/>
  <rect width="1000" height="260" rx="22" fill="url(#grid)"/>

  <rect x="-120" y="0" width="120" height="260" fill="url(#scan)">
    <animate attributeName="x" from="-140" to="1020" dur="4.8s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(34 28)">
    <circle cx="12" cy="12" r="6" fill="#34d399">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="12" r="6" fill="#22d3ee" opacity="0.75"/>
    <circle cx="60" cy="12" r="6" fill="#facc15" opacity="0.7"/>
    <text x="92" y="17" fill="#9fb8b1" font-family="Consolas, Menlo, monospace" font-size="15">root@blackhatshiftey:/ops</text>
  </g>

  <line x1="34" y1="66" x2="966" y2="66" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="Consolas, Menlo, monospace">
    <text x="64" y="112" fill="#69ffd2" font-size="20">$ ./profile --signal</text>
    <text x="64" y="164" fill="#ffffff" font-size="50" font-weight="700" filter="url(#glow)">BlackhatShiftey</text>
    <text x="66" y="203" fill="#9fb8b1" font-size="24">AI Architect | Python | Security Automation</text>
    <rect x="648" y="184" width="14" height="26" fill="#69ffd2">
      <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(760 104)" font-family="Consolas, Menlo, monospace">
    <rect x="0" y="0" width="170" height="94" rx="10" fill="#08100e" stroke="#1f8f75" stroke-opacity="0.55"/>
    <text x="18" y="30" fill="#69ffd2" font-size="14">STATUS</text>
    <text x="18" y="58" fill="#f8fafc" font-size="19" font-weight="700">ONLINE</text>
    <text x="18" y="80" fill="#9fb8b1" font-size="13">signal: high</text>
  </g>

  <path d="M64 229H268L286 216H472L490 229H936" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.25;0.85;0.25" dur="2.4s" repeatCount="indefinite"/>
  </path>
</svg>
