<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">BlackhatShiftey reflective terminal banner</title>
  <desc id="desc">Dark glass terminal banner for BlackhatShiftey, AI Architect, Python, Security Automation.</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17212a" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#080c12" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#030509" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#46f4ff" stop-opacity="0.35"/>
      <stop offset="0.34" stop-color="#f4f1ff" stop-opacity="0.86"/>
      <stop offset="0.68" stop-color="#c86bff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#34f5c5" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#d6fbff" stop-opacity="0.36"/>
      <stop offset="0.66" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
  </pattern>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="258" rx="22"/></clipPath>
  <rect width="1000" height="260" rx="24" fill="#030509"/>
  <rect x="1" y="1" width="998" height="258" rx="22" fill="url(#glass)"/>
  <rect x="1" y="1" width="998" height="258" rx="22" fill="url(#grid)"/>
  <rect x="10" y="10" width="980" height="240" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
  <rect x="2" y="2" width="996" height="256" rx="22" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <path d="M38 73H958" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M38 74H958" stroke="url(#edge)" stroke-opacity="0.46"/>
    <path d="M78 22H934L820 72H38Z" fill="url(#glint)" opacity="0.22"/>
    <path d="M704 0H1000V28H650Z" fill="#ffffff" opacity="0.035"/>
    <path d="M0 218H335L254 260H0Z" fill="#46f4ff" opacity="0.035"/>
  </g>
  <g transform="translate(38 30)" font-family="Consolas, Menlo, monospace">
    <circle cx="12" cy="12" r="5" fill="#c86bff" opacity="0.8"/>
    <circle cx="35" cy="12" r="5" fill="#46f4ff" opacity="0.78"/>
    <circle cx="58" cy="12" r="5" fill="#34f5c5" opacity="0.72"/>
    <text x="90" y="17" fill="#b8c7d4" font-size="15">root@blackhatshiftey:/ops</text>
  </g>
  <g font-family="Consolas, Menlo, monospace">
    <text x="64" y="114" fill="#9ff8ff" font-size="20">$ ./profile --signal</text>
    <rect x="314" y="96" width="11" height="22" fill="#9ff8ff">
      <animate attributeName="opacity" values="0.12;0.85;0.85;0.12" dur="1.45s" repeatCount="indefinite"/>
    </rect>
    <text x="64" y="166" fill="#ffffff" font-size="50" font-weight="700" filter="url(#softGlow)">BlackhatShiftey</text>
    <text x="66" y="204" fill="#b8c7d4" font-size="24">AI Architect | Python | Security Automation</text>
  </g>
  <g transform="translate(760 103)" font-family="Consolas, Menlo, monospace">
    <rect width="170" height="96" rx="12" fill="#071019" stroke="url(#edge)" stroke-opacity="0.8"/>
    <rect x="8" y="8" width="154" height="80" rx="9" fill="#ffffff" fill-opacity="0.035"/>
    <text x="18" y="29" fill="#9ff8ff" font-size="14">OPS CYCLE</text>
    <text x="18" y="55" fill="#ffffff" font-size="14" font-weight="700">BUILD BREAK FIX</text>
    <text x="18" y="78" fill="#9aa9b6" font-size="12">BENCHMARK IMPROVE</text>
  </g>
  <path d="M64 229H268L286 216H472L490 229H936" fill="none" stroke="url(#edge)" stroke-opacity="0.56" stroke-width="2"/>
</svg>
