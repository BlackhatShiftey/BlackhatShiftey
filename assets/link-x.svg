<svg xmlns="http://www.w3.org/2000/svg" width="190" height="58" viewBox="0 0 190 58" role="img" aria-labelledby="title desc">
  <title id="title">X link button</title>
  <desc id="desc">Black animated link button for Ex0_Byte on X.</desc>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="190" height="58" rx="12" fill="#000000"/>
  <rect x="1" y="1" width="188" height="56" rx="11" fill="none" stroke="#f8fafc" stroke-opacity="0.65"/>
  <rect x="-70" y="0" width="70" height="58" fill="url(#shine)">
    <animate attributeName="x" from="-80" to="200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(18 14)" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M2 2L28 30"/>
    <path d="M28 2L2 30"/>
  </g>
  <text x="62" y="25" fill="#ffffff" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700">X / Twitter</text>
  <text x="62" y="42" fill="#a3a3a3" font-family="Consolas, Menlo, monospace" font-size="12">@Ex0_Byte</text>
</svg>
