<svg xmlns="http://www.w3.org/2000/svg" width="190" height="58" viewBox="0 0 190 58" role="img" aria-labelledby="title desc">
  <title id="title">X link button</title>
  <desc id="desc">Reflective glass link button for Ex0_Byte on X.</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17212a" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#080c12" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#030509" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#8b8b8b" stop-opacity="0.78"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#2b2b2b" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.54" stop-color="#b6f7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <clipPath id="clip"><rect x="1" y="1" width="188" height="56" rx="12"/></clipPath>
  <rect width="190" height="58" rx="13" fill="#000000"/>
  <rect x="1" y="1" width="188" height="56" rx="12" fill="url(#glass)" opacity="0.72"/>
  <rect x="2" y="2" width="186" height="54" rx="11" fill="none" stroke="url(#edge)" stroke-width="1.7"/>
  <rect x="9" y="9" width="40" height="40" rx="10" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.1"/>
  <g clip-path="url(#clip)">
    <rect x="-150" y="0" width="105" height="58" fill="url(#glint)" opacity="0.55" transform="skewX(-19)">
      <animate attributeName="x" values="-170;-170;240;240" keyTimes="0;0.78;0.9;1" dur="26s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g transform="translate(18 17) scale(1.0)" fill="#ffffff" filter="url(#softGlow)">
    <path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/>
