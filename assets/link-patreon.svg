<svg xmlns="http://www.w3.org/2000/svg" width="220" height="58" viewBox="0 0 220 58" role="img" aria-labelledby="title desc">
  <title id="title">Patreon link button</title>
  <desc id="desc">Animated Patreon button with Patreon mark and brand color.</desc>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff674d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff674d" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff674d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="220" height="58" rx="12" fill="#130806"/>
  <rect x="1" y="1" width="218" height="56" rx="11" fill="none" stroke="#ff674d" stroke-opacity="0.85"/>
  <rect x="-76" y="0" width="76" height="58" fill="url(#shine)">
    <animate attributeName="x" from="-86" to="232" dur="3.8s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(17 13)" filter="url(#glow)">
    <rect x="0" y="2" width="8" height="33" rx="4" fill="#ff674d"/>
    <circle cx="25" cy="13" r="13" fill="#ff674d"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2.2s" repeatCount="indefinite" additive="sum"/>
  </g>
  <text x="62" y="25" fill="#ffffff" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700">Patreon</text>
  <text x="62" y="42" fill="#ffb4a5" font-family="Consolas, Menlo, monospace" font-size="12">Ex0_Byte</text>
</svg>
