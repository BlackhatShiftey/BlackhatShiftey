<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Animated Operator Dashboard</title>
  <desc id="desc">Glowing dashboard table showing AI systems, Python automation, Security automation, and Full-stack builds.</desc>
  <defs>
    <linearGradient id="stroke" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#69ffd2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#69ffd2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#69ffd2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="310" rx="20" fill="#05070a"/>
  <rect x="2" y="2" width="996" height="306" rx="18" fill="none" stroke="#1f8f75" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="3" y="3" width="994" height="304" rx="17" fill="none" stroke="#ff004c" stroke-width="2" stroke-dasharray="14 22" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-216" dur="13s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="3" width="994" height="304" rx="17" fill="none" stroke="#00ffd1" stroke-width="2" stroke-dasharray="14 22" stroke-dashoffset="12" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="12" to="-204" dur="13s" repeatCount="indefinite"/>
  </rect>
  <rect x="3" y="3" width="994" height="304" rx="17" fill="none" stroke="#2d7dff" stroke-width="2" stroke-dasharray="14 22" stroke-dashoffset="24" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="24" to="-192" dur="13s" repeatCount="indefinite"/>
  </rect>
  <rect x="-180" y="0" width="180" height="310" fill="url(#sweep)">
    <animate attributeName="x" from="-220" to="1040" dur="14s" repeatCount="indefinite"/>
  </rect>
  <text x="42" y="48" fill="#69ffd2" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700">OPERATOR DASHBOARD</text>
  <text x="42" y="74" fill="#9fb8b1" font-family="Consolas, Menlo, monospace" font-size="13">signal map // live focus lanes</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <g transform="translate(42 102)">
      <rect width="916" height="42" rx="9" fill="#08100e" stroke="#1f8f75" stroke-opacity="0.55"/>
      <circle cx="22" cy="21" r="6" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#f8fafc" font-weight="700">AI systems</text>
      <text x="238" y="26" fill="#9fb8b1">Agent workflows, model-assisted tooling, MCP-style integrations</text>
    </g>
    <g transform="translate(42 152)">
      <rect width="916" height="42" rx="9" fill="#08100e" stroke="#1f8f75" stroke-opacity="0.55"/>
      <circle cx="22" cy="21" r="6" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#f8fafc" font-weight="700">Python automation</text>
      <text x="238" y="26" fill="#9fb8b1">Scripts, CLIs, pipelines, workflow orchestration</text>
    </g>
    <g transform="translate(42 202)">
      <rect width="916" height="42" rx="9" fill="#08100e" stroke="#1f8f75" stroke-opacity="0.55"/>
      <circle cx="22" cy="21" r="6" fill="#facc15" filter="url(#glow)"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#f8fafc" font-weight="700">Security automation</text>
      <text x="238" y="26" fill="#9fb8b1">Recon helpers, validation workflows, hardening checks</text>
    </g>
    <g transform="translate(42 252)">
      <rect width="916" height="42" rx="9" fill="#08100e" stroke="#1f8f75" stroke-opacity="0.55"/>
      <circle cx="22" cy="21" r="6" fill="#fb7185" filter="url(#glow)"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#f8fafc" font-weight="700">Full-stack builds</text>
      <text x="238" y="26" fill="#9fb8b1">React, Node, APIs, dashboards, docs, deploy surfaces</text>
    </g>
  </g>
</svg>
