<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Reflective Operator Dashboard</title>
  <desc id="desc">Dark glass dashboard showing AI systems, Python automation, Security automation, and Full-stack builds.</desc>
  <defs>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17212a" stop-opacity="0.96"/>
      <stop offset="0.52" stop-color="#080c12" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#030509" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#46f4ff" stop-opacity="0.35"/>
      <stop offset="0.34" stop-color="#f4f1ff" stop-opacity="0.86"/>
      <stop offset="0.68" stop-color="#c86bff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#34f5c5" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.54" stop-color="#b6f7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>
  </pattern>
  <clipPath id="clip"><rect x="1" y="1" width="998" height="308" rx="22"/></clipPath>
  <rect width="1000" height="310" rx="24" fill="#030509"/>
  <rect x="1" y="1" width="998" height="308" rx="22" fill="url(#glass)"/>
  <rect x="1" y="1" width="998" height="308" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="996" height="306" rx="22" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect x="11" y="11" width="978" height="288" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
  <g clip-path="url(#clip)">
    <rect x="-250" y="0" width="190" height="310" fill="url(#glint)" opacity="0.54" transform="skewX(-18)">
      <animate attributeName="x" values="-280;-280;1110;1110" keyTimes="0;0.8;0.91;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="42" y="48" fill="#9ff8ff" font-family="Consolas, Menlo, monospace" font-size="19" font-weight="700">OPERATOR DASHBOARD</text>
  <text x="42" y="74" fill="#9aa9b6" font-family="Consolas, Menlo, monospace" font-size="13">signal map // focus lanes</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <g transform="translate(42 102)">
      <rect width="916" height="42" rx="10" fill="#071019" stroke="#46f4ff" stroke-opacity="0.42"/>
      <circle cx="22" cy="21" r="5" fill="#46f4ff" filter="url(#softGlow)"><animate attributeName="opacity" values="0.55;0.9;0.55" dur="12s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#ffffff" font-weight="700">AI systems</text>
      <text x="238" y="26" fill="#aeb9c4">Agent workflows, model-assisted tooling, MCP-style integrations</text>
    </g>
    <g transform="translate(42 152)">
      <rect width="916" height="42" rx="10" fill="#071019" stroke="#34f5c5" stroke-opacity="0.42"/>
      <circle cx="22" cy="21" r="5" fill="#34f5c5" filter="url(#softGlow)"><animate attributeName="opacity" values="0.9;0.55;0.9" dur="14s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#ffffff" font-weight="700">Python automation</text>
      <text x="238" y="26" fill="#aeb9c4">Scripts, CLIs, pipelines, workflow orchestration</text>
    </g>
    <g transform="translate(42 202)">
      <rect width="916" height="42" rx="10" fill="#071019" stroke="#f6dc7a" stroke-opacity="0.42"/>
      <circle cx="22" cy="21" r="5" fill="#f6dc7a" filter="url(#softGlow)"><animate attributeName="opacity" values="0.55;0.9;0.55" dur="16s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#ffffff" font-weight="700">Security automation</text>
      <text x="238" y="26" fill="#aeb9c4">Recon helpers, validation workflows, hardening checks</text>
    </g>
    <g transform="translate(42 252)">
      <rect width="916" height="42" rx="10" fill="#071019" stroke="#c86bff" stroke-opacity="0.42"/>
      <circle cx="22" cy="21" r="5" fill="#c86bff" filter="url(#softGlow)"><animate attributeName="opacity" values="0.9;0.55;0.9" dur="18s" repeatCount="indefinite"/></circle>
      <text x="46" y="26" fill="#ffffff" font-weight="700">Full-stack builds</text>
      <text x="238" y="26" fill="#aeb9c4">React, Node, APIs, dashboards, docs, deploy surfaces</text>
    </g>
  </g>
</svg>
