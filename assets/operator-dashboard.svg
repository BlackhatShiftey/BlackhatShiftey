<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Canticle research surface</title>
  <desc id="desc">A Canticle-style instrument panel mapping research questions through AI safety, open source, emergence, and agent systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1f2028"/><stop offset="1" stop-color="#13131a"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6090"/><stop offset=".25" stop-color="#e478d0"/><stop offset=".5" stop-color="#c4a7e7"/><stop offset=".75" stop-color="#7dcfff"/><stop offset="1" stop-color="#73daca"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7dcfff" stroke-opacity=".035"/></pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 .5H1000" stroke="#c0caf5" stroke-opacity=".025"/></pattern>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="350" rx="8" fill="#0e0e15"/>
  <rect x="1" y="1" width="998" height="348" rx="7" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="348" rx="7" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="348" rx="7" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="997" height="347" rx="7" fill="none" stroke="#3b3d57"/>
  <path d="M1 2H180M820 2H999" stroke="url(#spectrum)" stroke-width="2"/>
  <path d="M20 20V40M20 20H40M980 20H960M980 20V40M20 330V310M20 330H40M980 330H960M980 330V310" fill="none" stroke="#565f89"/>

  <g font-family="Fira Code, JetBrains Mono, Cascadia Mono, Consolas, monospace">
    <text x="42" y="44" fill="#e478d0" font-size="13" letter-spacing="1.5">╭─ RESEARCH SURFACE / PROGRAM MAP ─╮</text>
    <text x="42" y="69" fill="#565f89" font-size="11" letter-spacing="1">QUESTIONS ARE ROUTED THROUGH FOUR CONNECTED RESEARCH PROGRAMS</text>
    <circle cx="874" cy="40" r="3" fill="#73daca" filter="url(#glow)"/>
    <text x="887" y="44" fill="#9ece6a" font-size="11" letter-spacing="1">RESEARCH ACTIVE</text>

    <g transform="translate(42 96)">
      <g>
        <rect width="204" height="154" fill="#1a1b26" stroke="#ff6090" stroke-opacity=".62"/>
        <path d="M0 3H204" stroke="#ff6090" stroke-width="3"/>
        <text x="16" y="30" fill="#ff6090" font-size="11" letter-spacing="1.4">01 / AI RESEARCH</text>
        <text x="16" y="65" fill="#c0caf5" font-size="15" font-weight="700">Safety + capability</text>
        <text x="16" y="91" fill="#a9b1d6" font-size="12">evals · boundaries</text>
        <text x="16" y="111" fill="#a9b1d6" font-size="12">empirical questions</text>
        <rect x="16" y="132" width="108" height="2" fill="#ff6090" opacity=".3"/>
        <rect x="16" y="132" width="70" height="2" fill="#ff6090"/>
        <rect x="178" y="125" width="8" height="8" fill="#ff6090" opacity=".75"/>
      </g>
      <g transform="translate(234)">
        <rect width="204" height="154" fill="#1a1b26" stroke="#c4a7e7" stroke-opacity=".62"/>
        <path d="M0 3H204" stroke="#c4a7e7" stroke-width="3"/>
        <text x="16" y="30" fill="#c4a7e7" font-size="11" letter-spacing="1.4">02 / OPEN SOURCE</text>
        <text x="16" y="65" fill="#c0caf5" font-size="15" font-weight="700">Reproducible work</text>
        <text x="16" y="91" fill="#a9b1d6" font-size="12">code · docs · models</text>
        <text x="16" y="111" fill="#a9b1d6" font-size="12">benchmarks · evidence</text>
        <rect x="16" y="132" width="108" height="2" fill="#c4a7e7" opacity=".3"/>
        <rect x="16" y="132" width="82" height="2" fill="#c4a7e7"/>
        <rect x="178" y="125" width="8" height="8" fill="#c4a7e7" opacity=".75"/>
      </g>
      <g transform="translate(468)">
        <rect width="204" height="154" fill="#1a1b26" stroke="#7dcfff" stroke-opacity=".62"/>
        <path d="M0 3H204" stroke="#7dcfff" stroke-width="3"/>
        <text x="16" y="30" fill="#7dcfff" font-size="11" letter-spacing="1.4">03 / EMERGENCE</text>
        <text x="16" y="65" fill="#c0caf5" font-size="15" font-weight="700">Testable hypotheses</text>
        <text x="16" y="91" fill="#a9b1d6" font-size="12">long-horizon behavior</text>
        <text x="16" y="111" fill="#a9b1d6" font-size="12">complex systems</text>
        <rect x="16" y="132" width="108" height="2" fill="#7dcfff" opacity=".3"/>
        <rect x="16" y="132" width="91" height="2" fill="#7dcfff"/>
        <rect x="178" y="125" width="8" height="8" fill="#7dcfff" opacity=".75"/>
      </g>
      <g transform="translate(702)">
        <rect width="204" height="154" fill="#1a1b26" stroke="#73daca" stroke-opacity=".62"/>
        <path d="M0 3H204" stroke="#73daca" stroke-width="3"/>
        <text x="16" y="30" fill="#73daca" font-size="11" letter-spacing="1.4">04 / AGENT SYSTEMS</text>
        <text x="16" y="65" fill="#c0caf5" font-size="15" font-weight="700">Memory + agency</text>
        <text x="16" y="91" fill="#a9b1d6" font-size="12">provenance · retrieval</text>
        <text x="16" y="111" fill="#a9b1d6" font-size="12">tools · orchestration</text>
        <rect x="16" y="132" width="108" height="2" fill="#73daca" opacity=".3"/>
        <rect x="16" y="132" width="100" height="2" fill="#73daca"/>
        <rect x="178" y="125" width="8" height="8" fill="#73daca" opacity=".75"/>
      </g>
    </g>

    <g transform="translate(42 280)">
      <text x="0" y="16" fill="#565f89" font-size="11">QUESTION</text>
      <path d="M58 12H842" stroke="#3b3d57"/>
      <path d="M58 12H842" stroke="url(#spectrum)" stroke-width="2" stroke-dasharray="140 644" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="0;-784" dur="10s" repeatCount="indefinite"/>
      </path>
      <path d="M842 7L854 12L842 17Z" fill="#73daca"/>
      <text x="864" y="16" fill="#73daca" font-size="11">EVIDENCE</text>
    </g>
    <text x="42" y="327" fill="#565f89" font-size="10" letter-spacing="1">OBSERVE → TEST → BREAK → DOCUMENT → RELEASE</text>
    <text x="786" y="327" fill="#565f89" font-size="10" letter-spacing="1">SURFACE / 04 PROGRAMS</text>
  </g>
</svg>
